<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Vaibhav Jain — Backend Developer">
<title>Vaibhav Jain — Backend Developer</title>
<style>
text{font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{r:5;opacity:.9}100%{r:16;opacity:0}}
@keyframes drift1{50%{transform:translate(60px,30px)}}
@keyframes drift2{50%{transform:translate(-70px,-30px)}}
.f{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.ring{animation:pulse 2s ease-out infinite}
.o1{animation:drift1 14s ease-in-out infinite}
.o2{animation:drift2 18s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes l0{0%,3.75%{clip-path:inset(0 100% 0 0)}3.75%{animation-timing-function:steps(8,end)}6.75%,95%{clip-path:inset(0 0 0 0)}98%,100%{clip-path:inset(0 100% 0 0)}}.l0{animation:l0 16.0s linear infinite}@keyframes l1{0%,8.94%{clip-path:inset(0 100% 0 0)}8.94%{animation-timing-function:step-end}9.25%,95%{clip-path:inset(0 0 0 0)}98%,100%{clip-path:inset(0 100% 0 0)}}.l1{animation:l1 16.0s linear infinite}@keyframes l2{0%,10.81%{clip-path:inset(0 100% 0 0)}10.81%{animation-timing-function:steps(14,end)}16.06%,95%{clip-path:inset(0 0 0 0)}98%,100%{clip-path:inset(0 100% 0 0)}}.l2{animation:l2 16.0s linear infinite}@keyframes l3{0%,18.25%{clip-path:inset(0 100% 0 0)}18.25%{animation-timing-function:step-end}18.56%,95%{clip-path:inset(0 0 0 0)}98%,100%{clip-path:inset(0 100% 0 0)}}.l3{animation:l3 16.0s linear infinite}@keyframes l4{0%,20.12%{clip-path:inset(0 100% 0 0)}20.12%{animation-timing-function:step-end}20.44%,95%{clip-path:inset(0 0 0 0)}98%,100%{clip-path:inset(0 100% 0 0)}}.l4{animation:l4 16.0s linear infinite}@keyframes l5{0%,22.00%{clip-path:inset(0 100% 0 0)}22.00%{animation-timing-function:step-end}22.31%,95%{clip-path:inset(0 0 0 0)}98%,100%{clip-path:inset(0 100% 0 0)}}.l5{animation:l5 16.0s linear infinite}@keyframes l6{0%,23.87%{clip-path:inset(0 100% 0 0)}23.87%{animation-timing-function:steps(15,end)}29.50%,95%{clip-path:inset(0 0 0 0)}98%,100%{clip-path:inset(0 100% 0 0)}}.l6{animation:l6 16.0s linear infinite}@keyframes l7{0%,31.69%{clip-path:inset(0 100% 0 0)}31.69%{animation-timing-function:step-end}32.00%,95%{clip-path:inset(0 0 0 0)}98%,100%{clip-path:inset(0 100% 0 0)}}.l7{animation:l7 16.0s linear infinite}@keyframes blink{50%{opacity:0}}.cur{animation:blink 1s step-end infinite}</style>
<defs>
<linearGradient id="gh" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
  <stop offset="0" stop-color="#22d3ee"/><stop offset=".33" stop-color="#a78bfa"/>
  <stop offset=".66" stop-color="#f472b6"/><stop offset="1" stop-color="#22d3ee"/>
  <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="bgh" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#060912"/><stop offset="1" stop-color="#0d1328"/>
</linearGradient>
<radialGradient id="och"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="ovh"><stop offset="0" stop-color="#a78bfa" stop-opacity=".30"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<pattern id="dotsh" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1e293b"/></pattern>
<clipPath id="ch"><rect width="1200" height="440" rx="24"/></clipPath></defs>
<g clip-path="url(#ch)">
  <rect width="1200" height="440" fill="url(#bgh)"/>
  <rect width="1200" height="440" fill="url(#dotsh)" opacity=".6"/>
  <circle class="o1" cx="180" cy="44" r="384" fill="url(#och)"/>
  <circle class="o2" cx="1080" cy="440" r="432" fill="url(#ovh)"/>

  <g class="f" style="animation-delay:.1s">
    <rect x="64" y="52" width="372" height="32" rx="16" fill="#0f172a" stroke="#1e3a5f"/>
    <circle class="ring" cx="84" cy="68" r="5" fill="none" stroke="#34d399" stroke-width="2"/>
    <circle cx="84" cy="68" r="4.5" fill="#34d399"/>
    <text x="100" y="73" font-size="14" fill="#cbd5e1">Open to backend &amp; distributed-systems talks</text>
  </g>
  <text class="f" style="animation-delay:.25s" x="60" y="168" font-size="78" font-weight="800" letter-spacing="-2.5" fill="url(#gh)">Vaibhav Jain</text>
  <text class="f" style="animation-delay:.4s" x="64" y="214" font-size="27" font-weight="600" fill="#f1f5f9">Backend Developer</text>
  <text class="f" style="animation-delay:.5s" x="64" y="250" font-size="18" fill="#94a3b8">Booking &amp; scheduling APIs on Google Cloud for healthtech</text>
  <text class="f" style="animation-delay:.6s" x="64" y="280" font-size="16" fill="#64748b">Junior Software Developer @ IntelligentDX  ·  Pune, India</text>
  <g class="f" style="animation-delay:.75s"><rect x="64" y="322" width="72" height="29" rx="14.5" fill="#0f172a" stroke="#1e2a44"/><text class="mono" x="76" y="341.2" font-size="13" fill="#cbd5e1">Python</text><rect x="146.36" y="322" width="80" height="29" rx="14.5" fill="#0f172a" stroke="#1e2a44"/><text class="mono" x="158.36" y="341.2" font-size="13" fill="#cbd5e1">Node.js</text><rect x="236.78000000000003" y="322" width="80" height="29" rx="14.5" fill="#0f172a" stroke="#1e2a44"/><text class="mono" x="248.78000000000003" y="341.2" font-size="13" fill="#cbd5e1">C#/.NET</text><rect x="327.20000000000005" y="322" width="56" height="29" rx="14.5" fill="#0f172a" stroke="#1e2a44"/><text class="mono" x="339.20000000000005" y="341.2" font-size="13" fill="#cbd5e1">Java</text><rect x="393.44000000000005" y="322" width="113" height="29" rx="14.5" fill="#0f172a" stroke="#1e2a44"/><text class="mono" x="405.44000000000005" y="341.2" font-size="13" fill="#cbd5e1">Spring Boot</text><rect x="516.1" y="322" width="121" height="29" rx="14.5" fill="#0f172a" stroke="#1e2a44"/><text class="mono" x="528.1" y="341.2" font-size="13" fill="#cbd5e1">Google Cloud</text></g>

  <g class="f" style="animation-delay:.3s">
    <rect x="690" y="52" width="460" height="336" rx="14" fill="#070c18" fill-opacity=".92" stroke="#1f2a44"/>
    <path d="M690 66a14 14 0 0 1 14-14h432a14 14 0 0 1 14 14v22H690z" fill="#0f172a"/>
    <circle cx="712" cy="70" r="6" fill="#ff5f57"/><circle cx="732" cy="70" r="6" fill="#febc2e"/><circle cx="752" cy="70" r="6" fill="#28c840"/>
    <text class="mono" x="920" y="75" font-size="13" fill="#64748b" text-anchor="middle">vaibhav@pune: ~</text>
    <text class="mono l0" x="712" y="112" font-size="15" xml:space="preserve"><tspan fill="#22d3ee">$ </tspan><tspan fill="#f1f5f9">whoami</tspan></text><text class="mono l1" x="712" y="140" font-size="15" xml:space="preserve"><tspan fill="#94a3b8">backend developer · healthtech · pune</tspan></text><text class="mono l2" x="712" y="168" font-size="15" xml:space="preserve"><tspan fill="#22d3ee">$ </tspan><tspan fill="#f1f5f9">cat now.yaml</tspan></text><text class="mono l3" x="712" y="196" font-size="15" xml:space="preserve"><tspan fill="#a78bfa">shipping: </tspan><tspan fill="#94a3b8">booking APIs on Google Cloud</tspan></text><text class="mono l4" x="712" y="224" font-size="15" xml:space="preserve"><tspan fill="#a78bfa">building: </tspan><tspan fill="#94a3b8">hash-chained voting system</tspan></text><text class="mono l5" x="712" y="252" font-size="15" xml:space="preserve"><tspan fill="#a78bfa">next:     </tspan><tspan fill="#94a3b8">10k-vote load test, p95 &lt; 500ms</tspan></text><text class="mono l6" x="712" y="280" font-size="15" xml:space="preserve"><tspan fill="#22d3ee">$ </tspan><tspan fill="#f1f5f9">echo $JOURNEY</tspan></text><text class="mono l7" x="712" y="308" font-size="15" xml:space="preserve"><tspan fill="#34d399">mechanical eng → PG-DAC → backend dev</tspan></text>
    <text class="mono" x="712" y="336" font-size="15"><tspan fill="#22d3ee">$ </tspan><tspan class="cur" fill="#f1f5f9">█</tspan></text>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="439" rx="24" fill="none" stroke="#1f2a44"/>
</svg>
