<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Blockchain-Inspired Voting System">
<title>Blockchain-Inspired Voting System</title>
<style>
text{font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{r:5;opacity:.9}100%{r:16;opacity:0}}
@keyframes drift1{50%{transform:translate(60px,30px)}}
@keyframes drift2{50%{transform:translate(-70px,-30px)}}
.f{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.ring{animation:pulse 2s ease-out infinite}
.o1{animation:drift1 14s ease-in-out infinite}
.o2{animation:drift2 18s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes tb{0%,38%{stroke:#25406b}42%,88%{stroke:#f87171}92%,100%{stroke:#25406b}}
.tb{animation:tb 12s infinite}
@keyframes show{0%,40%{opacity:0}43%,88%{opacity:1}91%,100%{opacity:0}}
@keyframes hide{0%,40%{opacity:1}43%,88%{opacity:0}91%,100%{opacity:1}}
@keyframes late{0%,55%{opacity:0}58%,88%{opacity:1}91%,100%{opacity:0}}
@keyframes early{0%,52%{opacity:1}55%,91%{opacity:0}94%,100%{opacity:1}}
.hbad,.ed{animation:show 12s infinite}
.hok{animation:hide 12s infinite}
.x,.bad{animation:late 12s infinite}
.ok{animation:early 12s infinite}
@keyframes lk{0%,52%{opacity:1}55%,91%{opacity:.15}94%,100%{opacity:1}}
.lk{animation:lk 12s infinite}
@keyframes flow{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(36px);opacity:0}}
.flow{animation:flow 1.5s linear infinite}
</style>
<defs>
<linearGradient id="gv" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
  <stop offset="0" stop-color="#22d3ee"/><stop offset=".33" stop-color="#a78bfa"/>
  <stop offset=".66" stop-color="#f472b6"/><stop offset="1" stop-color="#22d3ee"/>
  <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="bgv" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#060912"/><stop offset="1" stop-color="#0d1328"/>
</linearGradient>
<radialGradient id="ocv"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="ovv"><stop offset="0" stop-color="#a78bfa" stop-opacity=".30"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<pattern id="dotsv" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1e293b"/></pattern>
<clipPath id="cv"><rect width="1200" height="600" rx="24"/></clipPath></defs>
<g clip-path="url(#cv)">
  <rect width="1200" height="600" fill="url(#bgv)"/>
  <rect width="1200" height="600" fill="url(#dotsv)" opacity=".6"/>
  <circle class="o1" cx="1020" cy="30" r="384" fill="url(#ocv)"/>
  <circle class="o2" cx="120" cy="600" r="432" fill="url(#ovv)"/>

  <text class="mono" x="56" y="62" font-size="13" letter-spacing="2.5" fill="#22d3ee">FLAGSHIP PROJECT  ·  6 SPRING BOOT MICROSERVICES</text>
  <text x="54" y="114" font-size="44" font-weight="800" letter-spacing="-1.2" fill="#f1f5f9">Blockchain-Inspired <tspan fill="url(#gv)">Voting System</tspan></text>
  <text x="56" y="152" font-size="18" fill="#94a3b8">Every vote stores the SHA-256 hash of the vote before it. Edit or delete any row</text>
  <text x="56" y="178" font-size="18" fill="#94a3b8">and the chain breaks — and the validator finds exactly where.</text>
  <g>
  <rect  x="56" y="228" width="240" height="140" rx="16" fill="#0a1222" stroke="#25406b" stroke-width="1.5"/>
  <rect x="56" y="228" width="240" height="4" rx="2" fill="url(#gv)"/>
  <text class="mono" x="76" y="262" font-size="14" font-weight="700" fill="#22d3ee">VOTE #1</text>
  <text class="mono" x="76" y="298" font-size="12.5" fill="#64748b">prev</text>
  <text class="mono" x="120" y="298" font-size="13.5" fill="#cbd5e1">GENESIS</text>
  <text class="mono" x="76" y="330" font-size="12.5" fill="#64748b">hash</text>
  <text class="mono " x="120" y="330" font-size="13.5" fill="#34d399">9f2c…e1a4</text>
  
  <text class="mono" x="76" y="354" font-size="11" fill="#475569">SHA-256(vote + prev)</text>
</g><g>
  <rect  x="340" y="228" width="240" height="140" rx="16" fill="#0a1222" stroke="#25406b" stroke-width="1.5"/>
  <rect x="340" y="228" width="240" height="4" rx="2" fill="url(#gv)"/>
  <text class="mono" x="360" y="262" font-size="14" font-weight="700" fill="#22d3ee">VOTE #2</text>
  <text class="mono" x="360" y="298" font-size="12.5" fill="#64748b">prev</text>
  <text class="mono" x="404" y="298" font-size="13.5" fill="#cbd5e1">9f2c…e1a4</text>
  <text class="mono" x="360" y="330" font-size="12.5" fill="#64748b">hash</text>
  <text class="mono " x="404" y="330" font-size="13.5" fill="#34d399">4b7d…03c9</text>
  
  <text class="mono" x="360" y="354" font-size="11" fill="#475569">SHA-256(vote + prev)</text>
</g><g>
  <rect class="tb" x="624" y="228" width="240" height="140" rx="16" fill="#0a1222" stroke="#25406b" stroke-width="1.5"/>
  <rect x="624" y="228" width="240" height="4" rx="2" fill="url(#gv)"/>
  <text class="mono" x="644" y="262" font-size="14" font-weight="700" fill="#22d3ee">VOTE #3</text>
  <text class="mono" x="644" y="298" font-size="12.5" fill="#64748b">prev</text>
  <text class="mono" x="688" y="298" font-size="13.5" fill="#cbd5e1">4b7d…03c9</text>
  <text class="mono" x="644" y="330" font-size="12.5" fill="#64748b">hash</text>
  <text class="mono hok" x="688" y="330" font-size="13.5" fill="#34d399">c81e…7f52</text>
  <text class="mono hbad" x="688" y="330" font-size="13.5" fill="#f87171">e03d…b812</text>
  <text class="mono" x="644" y="354" font-size="11" fill="#475569">SHA-256(vote + prev)</text>
</g><g>
  <rect  x="908" y="228" width="240" height="140" rx="16" fill="#0a1222" stroke="#25406b" stroke-width="1.5"/>
  <rect x="908" y="228" width="240" height="4" rx="2" fill="url(#gv)"/>
  <text class="mono" x="928" y="262" font-size="14" font-weight="700" fill="#22d3ee">VOTE #4</text>
  <text class="mono" x="928" y="298" font-size="12.5" fill="#64748b">prev</text>
  <text class="mono" x="972" y="298" font-size="13.5" fill="#cbd5e1">c81e…7f52</text>
  <text class="mono" x="928" y="330" font-size="12.5" fill="#64748b">hash</text>
  <text class="mono " x="972" y="330" font-size="13.5" fill="#34d399">1a9b…d6e0</text>
  
  <text class="mono" x="928" y="354" font-size="11" fill="#475569">SHA-256(vote + prev)</text>
</g>
  <g>
  <path d="M300 298.0h36" stroke="#2d4a7a" stroke-width="2.5" stroke-dasharray="4 4"/>
  <rect x="309.0" y="292.0" width="18" height="12" rx="6" fill="none" stroke="#22d3ee" stroke-width="2"/>
</g>
