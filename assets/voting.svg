  <path d="M584 298.0h36" stroke="#2d4a7a" stroke-width="2.5" stroke-dasharray="4 4"/>
  <rect x="593.0" y="292.0" width="18" height="12" rx="6" fill="none" stroke="#22d3ee" stroke-width="2"/>
</g>
<circle class="flow" style="animation-delay:0.5s" cx="584" cy="298.0" r="3.5" fill="#22d3ee"/><g class="lk">
  <path d="M868 298.0h36" stroke="#2d4a7a" stroke-width="2.5" stroke-dasharray="4 4"/>
  <rect x="877.0" y="292.0" width="18" height="12" rx="6" fill="none" stroke="#22d3ee" stroke-width="2"/>
</g>
<circle class="flow" style="animation-delay:1.0s" cx="868" cy="298.0" r="3.5" fill="#22d3ee"/><g class="x"><circle cx="886.0" cy="298.0" r="13" fill="#2a0f14" stroke="#f87171" stroke-width="2"/>
  <path d="M881.0 293.0l10 10M891.0 293.0l-10 10" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/></g>
  <g class="ed"><rect x="670" y="188" width="153" height="28" rx="14.0" fill="#2a0f14" stroke="#7f1d1d"/><circle cx="684" cy="202.0" r="3.5" fill="#f87171"/><text class="mono" x="694" y="206.3" font-size="12" fill="#f87171">row edited in DB</text></g>
  <g class="ok"><rect x="56" y="392" width="364" height="29" rx="14.5" fill="#052e1f" stroke="#065f46"/><circle cx="70" cy="406.5" r="3.5" fill="#34d399"/><text class="mono" x="80" y="411.2" font-size="13" fill="#34d399">POST /votes/chain/validate → chain intact</text></g><g class="bad"><rect x="56" y="392" width="510" height="29" rx="14.5" fill="#271a05" stroke="#78350f"/><circle cx="70" cy="406.5" r="3.5" fill="#fbbf24"/><text class="mono" x="80" y="411.2" font-size="13" fill="#fbbf24">POST /votes/chain/validate → 1 broken link found at VOTE #4</text></g>
  <text class="mono" x="56" y="462" font-size="12" letter-spacing="2" fill="#64748b">SERVICES</text>
  <rect x="56" y="478" width="129" height="30" rx="15.0" fill="#0f172a" stroke="#1e2a44"/><circle cx="70" cy="493.0" r="3.5" fill="#22d3ee"/><text class="mono" x="80" y="498.0" font-size="14" fill="#e2e8f0">API Gateway</text><rect x="197.48000000000002" y="478" width="69" height="30" rx="15.0" fill="#0f172a" stroke="#1e2a44"/><circle cx="211.48000000000002" cy="493.0" r="3.5" fill="#a78bfa"/><text class="mono" x="221.48000000000002" y="498.0" font-size="14" fill="#e2e8f0">User</text><rect x="278.20000000000005" y="478" width="112" height="30" rx="15.0" fill="#0f172a" stroke="#1e2a44"/><circle cx="292.20000000000005" cy="493.0" r="3.5" fill="#f472b6"/><text class="mono" x="302.20000000000005" y="498.0" font-size="14" fill="#e2e8f0">Candidate</text><rect x="402.32000000000005" y="478" width="86" height="30" rx="15.0" fill="#0f172a" stroke="#1e2a44"/><circle cx="416.32000000000005" cy="493.0" r="3.5" fill="#34d399"/><text class="mono" x="426.32000000000005" y="498.0" font-size="14" fill="#e2e8f0">Voting</text><rect x="500.40000000000003" y="478" width="86" height="30" rx="15.0" fill="#0f172a" stroke="#1e2a44"/><circle cx="514.4000000000001" cy="493.0" r="3.5" fill="#fbbf24"/><text class="mono" x="524.4000000000001" y="498.0" font-size="14" fill="#e2e8f0">Result</text><rect x="598.48" y="478" width="86" height="30" rx="15.0" fill="#0f172a" stroke="#1e2a44"/><circle cx="612.48" cy="493.0" r="3.5" fill="#94a3b8"/><text class="mono" x="622.48" y="498.0" font-size="14" fill="#e2e8f0">Eureka</text>
  <text class="mono" x="56" y="560" font-size="13.5" fill="#64748b">Java 17 · Spring Boot 3.3 · Spring Cloud · Kafka · Redis · PostgreSQL · Resilience4j · Docker · Kubernetes</text>

</g>
