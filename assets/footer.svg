<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Let&#x27;s build something reliable">
<title>Let's build something reliable</title>
<style>
text{font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{r:5;opacity:.9}100%{r:16;opacity:0}}
@keyframes drift1{50%{transform:translate(60px,30px)}}
@keyframes drift2{50%{transform:translate(-70px,-30px)}}
.f{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.ring{animation:pulse 2s ease-out infinite}
.o1{animation:drift1 14s ease-in-out infinite}
.o2{animation:drift2 18s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes wave{to{transform:translateX(-1200px)}}.w0{animation:wave 14s linear infinite}.w1{animation:wave 19s linear infinite}.w2{animation:wave 24s linear infinite}</style>
<defs>
<linearGradient id="gf" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
  <stop offset="0" stop-color="#22d3ee"/><stop offset=".33" stop-color="#a78bfa"/>
  <stop offset=".66" stop-color="#f472b6"/><stop offset="1" stop-color="#22d3ee"/>
  <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="bgf" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#060912"/><stop offset="1" stop-color="#0d1328"/>
</linearGradient>
<radialGradient id="ocf"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="ovf"><stop offset="0" stop-color="#a78bfa" stop-opacity=".30"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<pattern id="dotsf" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1e293b"/></pattern>
<clipPath id="cf"><rect width="1200" height="230" rx="24"/></clipPath></defs>
<g clip-path="url(#cf)">
  <rect width="1200" height="230" fill="url(#bgf)"/>
  <rect width="1200" height="230" fill="url(#dotsf)" opacity=".6"/>
  <circle class="o1" cx="240" cy="0" r="384" fill="url(#ocf)"/>
  <circle class="o2" cx="960" cy="230" r="432" fill="url(#ovf)"/>

  <path class="w0" d="M0 200 C 200 182, 400 218, 600 200 S 1000 182, 1200 200 S 1600 182, 1800 200 S 2200 182, 2400 200" fill="none" stroke="url(#gf)" stroke-width="1.5" opacity="0.60"/><path class="w1" d="M0 208 C 200 190, 400 226, 600 208 S 1000 190, 1200 208 S 1600 190, 1800 208 S 2200 190, 2400 208" fill="none" stroke="url(#gf)" stroke-width="1.5" opacity="0.43"/><path class="w2" d="M0 216 C 200 198, 400 234, 600 216 S 1000 198, 1200 216 S 1600 198, 1800 216 S 2200 198, 2400 216" fill="none" stroke="url(#gf)" stroke-width="1.5" opacity="0.26"/>
  <text x="600" y="92" text-anchor="middle" font-size="42" font-weight="800" letter-spacing="-1.2" fill="url(#gf)">Let’s build something reliable.</text>
  <text x="600" y="132" text-anchor="middle" font-size="18" fill="#94a3b8">Backend engineering · distributed systems · interesting problems</text>
  <text class="mono" x="600" y="168" text-anchor="middle" font-size="15" fill="#22d3ee">vaibhav.jain.careers@gmail.com</text>

</g>
<rect x=".5" y=".5" width="1199" height="229" rx="24" fill="none" stroke="#1f2a44"/>
</svg>
