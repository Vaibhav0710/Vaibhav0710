<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Vaibhav Jain, Backend Developer">
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#161b22"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 700 60px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #58a6ff; animation: fade 1.2s ease-in both; }
    .desc { font: 400 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8b949e; animation: fade 1.2s 0.3s ease-in both; }
