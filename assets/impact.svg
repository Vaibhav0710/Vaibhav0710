<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="Impact at IntelligentDX">
<title>Impact at IntelligentDX</title>
<style>
text{font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{r:5;opacity:.9}100%{r:16;opacity:0}}
@keyframes drift1{50%{transform:translate(60px,30px)}}
@keyframes drift2{50%{transform:translate(-70px,-30px)}}
.f{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.ring{animation:pulse 2s ease-out infinite}
.o1{animation:drift1 14s ease-in-out infinite}
.o2{animation:drift2 18s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes lane{0%,8%{fill:#1e293b}18%,85%{fill:#22d3ee}100%{fill:#1e293b}}
.ln{fill:#1e293b;animation:lane 6s ease-in-out infinite}
@keyframes bar{0%{transform:scaleX(1.45)}35%,85%{transform:scaleX(1)}100%{transform:scaleX(1.45)}}
.bar{transform-box:fill-box;transform-origin:left;animation:bar 5s cubic-bezier(.6,0,.2,1) infinite}
@keyframes pkt{0%{transform:translateX(40px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(330px);opacity:0}}
.pkt{animation:pkt 3s linear infinite}
</style>
<defs>
<linearGradient id="gi" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
  <stop offset="0" stop-color="#22d3ee"/><stop offset=".33" stop-color="#a78bfa"/>
  <stop offset=".66" stop-color="#f472b6"/><stop offset="1" stop-color="#22d3ee"/>
  <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="bgi" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#060912"/><stop offset="1" stop-color="#0d1328"/>
</linearGradient>
<radialGradient id="oci"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="ovi"><stop offset="0" stop-color="#a78bfa" stop-opacity=".30"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<pattern id="dotsi" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1e293b"/></pattern>
</defs>
<g transform="translate(0,0)"><g transform="translate(0,0)">
  <clipPath id="ta"><rect width="580" height="250" rx="20"/></clipPath>
  <g clip-path="url(#ta)">
    <rect width="580" height="250" fill="url(#bgi)"/>
    <rect width="580" height="250" fill="url(#dotsi)" opacity=".5"/>
    <circle cx="580" cy="0" r="348" fill="url(#oci)"/>
  </g>
  <rect x=".5" y=".5" width="579" height="249" rx="20" fill="none" stroke="#1f2a44"/>
  
  <text class="mono" x="28" y="44" font-size="12.5" letter-spacing="2" fill="#22d3ee">TREATMENT-PLAN BOOKING</text>
  <g><rect x="372" y="24" width="180" height="28" rx="14" fill="#052e1f" stroke="#065f46"/>
  <circle class="ring" cx="390" cy="38" r="4" fill="none" stroke="#34d399" stroke-width="2"/><circle cx="390" cy="38" r="4" fill="#34d399"/>
  <text class="mono" x="402" y="42.5" font-size="11.5" fill="#34d399">LIVE SINCE SEP 2026</text></g>
  <text x="26" y="112" font-size="54" font-weight="800" letter-spacing="-1.5" fill="url(#gi)">15 parallel lanes</text>
  <text x="28" y="148" font-size="15.5" fill="#94a3b8">Books every visit of a multi-appointment plan with atomic slot</text><text x="28" y="171" font-size="15.5" fill="#94a3b8">reservation, one audit row per appointment and 200/207/422</text><text x="28" y="194" font-size="15.5" fill="#94a3b8">responses.</text>
  <rect class="ln" style="animation-delay:0.00s" x="28.0" y="206" width="28" height="12" rx="4"/><rect class="ln" style="animation-delay:0.12s" x="62.8" y="206" width="28" height="12" rx="4"/><rect class="ln" style="animation-delay:0.24s" x="97.6" y="206" width="28" height="12" rx="4"/><rect class="ln" style="animation-delay:0.36s" x="132.4" y="206" width="28" height="12" rx="4"/><rect class="ln" style="animation-delay:0.48s" x="167.2" y="206" width="28" height="12" rx="4"/><rect class="ln" style="animation-delay:0.60s" x="202.0" y="206" width="28" height="12" rx="4"/><rect class="ln" style="animation-delay:0.72s" x="236.8" y="206" width="28" height="12" rx="4"/><rect class="ln" style="animation-delay:0.84s" x="271.6" y="206" width="28" height="12" rx="4"/><rect class="ln" style="animation-delay:0.96s" x="306.4" y="206" width="28" height="12" rx="4"/><rect class="ln" style="animation-delay:1.08s" x="341.2" y="206" width="28" height="12" rx="4"/><rect class="ln" style="animation-delay:1.20s" x="376.0" y="206" width="28" height="12" rx="4"/><rect class="ln" style="animation-delay:1.32s" x="410.8" y="206" width="28" height="12" rx="4"/><rect class="ln" style="animation-delay:1.44s" x="445.6" y="206" width="28" height="12" rx="4"/><rect class="ln" style="animation-delay:1.56s" x="480.4" y="206" width="28" height="12" rx="4"/><rect class="ln" style="animation-delay:1.68s" x="515.2" y="206" width="28" height="12" rx="4"/>
</g><g transform="translate(600,0)">
  <clipPath id="tb"><rect width="290" height="250" rx="20"/></clipPath>
  <g clip-path="url(#tb)">
    <rect width="290" height="250" fill="url(#bgi)"/>
    <rect width="290" height="250" fill="url(#dotsi)" opacity=".5"/>
    <circle cx="290" cy="0" r="174" fill="url(#ovi)"/>
  </g>
  <rect x=".5" y=".5" width="289" height="249" rx="20" fill="none" stroke="#1f2a44"/>
  
  <text class="mono" x="28" y="44" font-size="12.5" letter-spacing="2" fill="#a78bfa">CANCEL &amp; RESCHEDULE</text>
  <text x="26" y="112" font-size="56" font-weight="800" fill="url(#gi)">207</text>
  <text class="mono" x="132" y="110" font-size="14" fill="#94a3b8">Multi-Status</text>
  <text x="28" y="148" font-size="15" fill="#94a3b8">Book-the-new-slot-first</text><text x="28" y="170" font-size="15" fill="#94a3b8">reschedule on an EHR with none</text><text x="28" y="193" font-size="15" fill="#94a3b8">built in. Timed retries, full</text><text x="28" y="216" font-size="15" fill="#94a3b8">audit trail.</text>
</g><g transform="translate(910,0)">
  <clipPath id="tc"><rect width="290" height="250" rx="20"/></clipPath>
  <g clip-path="url(#tc)">
    <rect width="290" height="250" fill="url(#bgi)"/>
    <rect width="290" height="250" fill="url(#dotsi)" opacity=".5"/>
    <circle cx="290" cy="0" r="174" fill="url(#ovi)"/>
  </g>
  <rect x=".5" y=".5" width="289" height="249" rx="20" fill="none" stroke="#1f2a44"/>
  
  <text class="mono" x="28" y="44" font-size="12.5" letter-spacing="2" fill="#f472b6">SLOT SEARCH</text>
  <text x="26" y="104" font-size="44" font-weight="800" letter-spacing="-1" fill="url(#gi)">1.7–2.5s</text>
  <text x="28" y="132" font-size="14.5" fill="#94a3b8">down from 2.7–3.6s</text>
  <text class="mono" x="28" y="166" font-size="11" fill="#64748b">BEFORE</text>
  <rect x="88" y="157" width="174" height="10" rx="5" fill="#334155"/>
  <text class="mono" x="28" y="190" font-size="11" fill="#64748b">AFTER</text>
  <rect class="bar" x="88" y="181" width="120" height="10" rx="5" fill="#22d3ee"/>
  <text x="28" y="226" font-size="14" fill="#94a3b8">Concurrent pager · FHIR R4</text>
</g><g transform="translate(0,270)">
  <clipPath id="td"><rect width="386.6666666666667" height="250" rx="20"/></clipPath>
  <g clip-path="url(#td)">
    <rect width="386.6666666666667" height="250" fill="url(#bgi)"/>
    <rect width="386.6666666666667" height="250" fill="url(#dotsi)" opacity=".5"/>
    <circle cx="386.6666666666667" cy="0" r="232" fill="url(#oci)"/>
  </g>
  <rect x=".5" y=".5" width="385.6666666666667" height="249" rx="20" fill="none" stroke="#1f2a44"/>
  
  <text class="mono" x="28" y="44" font-size="12.5" letter-spacing="2" fill="#22d3ee">BACKGROUND SYNC</text>
  <text x="26" y="108" font-size="40" font-weight="800" letter-spacing="-1" fill="url(#gi)">213 × 111 × 70</text>
  <text x="28" y="140" font-size="15" fill="#94a3b8">providers × locations × visit types</text>
  <text x="28" y="164" font-size="15" fill="#94a3b8">now served from indexed DB reads</text>
  <rect x="28" y="188" width="85" height="27" rx="13.5" fill="#0f172a" stroke="#1e2a44"/><text class="mono" x="40" y="205.5" font-size="11" fill="#cbd5e1">Scheduler</text><path d="M115 201h8" stroke="#334155" stroke-width="2"/><rect x="125.38" y="188" width="119" height="27" rx="13.5" fill="#0f172a" stroke="#1e2a44"/><text class="mono" x="137.38" y="205.5" font-size="11" fill="#cbd5e1">Cloud Run Jobs</text><path d="M247 201h8" stroke="#334155" stroke-width="2"/><rect x="256.86" y="188" width="92" height="27" rx="13.5" fill="#0f172a" stroke="#1e2a44"/><text class="mono" x="268.86" y="205.5" font-size="11" fill="#cbd5e1">PostgreSQL</text>
  <circle class="pkt" cx="0" cy="201" r="4" fill="#22d3ee"/>
</g><g transform="translate(406.6666666666667,270)">
  <clipPath id="te"><rect width="386.6666666666667" height="250" rx="20"/></clipPath>
  <g clip-path="url(#te)">
    <rect width="386.6666666666667" height="250" fill="url(#bgi)"/>
    <rect width="386.6666666666667" height="250" fill="url(#dotsi)" opacity=".5"/>
    <circle cx="386.6666666666667" cy="0" r="232" fill="url(#ovi)"/>
  </g>
  <rect x=".5" y=".5" width="385.6666666666667" height="249" rx="20" fill="none" stroke="#1f2a44"/>
  
  <text class="mono" x="28" y="44" font-size="12.5" letter-spacing="2" fill="#a78bfa">AI RULE GENERATION</text>
  <text x="26" y="112" font-size="54" font-weight="800" letter-spacing="-1.5" fill="url(#gi)">27–31%</text>
  <text x="28" y="142" font-size="15" fill="#f1f5f9">lower cost per generated rule</text>
  <text x="28" y="176" font-size="15" fill="#94a3b8">Built around Claude with validation gates</text><text x="28" y="198" font-size="15" fill="#94a3b8">and a repair loop; prompt caching drove</text><text x="28" y="221" font-size="15" fill="#94a3b8">the savings.</text>
</g><g transform="translate(813.3333333333334,270)">
  <clipPath id="tf"><rect width="386.6666666666667" height="250" rx="20"/></clipPath>
  <g clip-path="url(#tf)">
    <rect width="386.6666666666667" height="250" fill="url(#bgi)"/>
    <rect width="386.6666666666667" height="250" fill="url(#dotsi)" opacity=".5"/>
    <circle cx="386.6666666666667" cy="0" r="232" fill="url(#oci)"/>
  </g>
  <rect x=".5" y=".5" width="385.6666666666667" height="249" rx="20" fill="none" stroke="#1f2a44"/>
  
  <text class="mono" x="28" y="44" font-size="12.5" letter-spacing="2" fill="#f472b6">DATA MIGRATION · INTERN</text>
  <text x="26" y="112" font-size="54" font-weight="800" letter-spacing="-1.5" fill="url(#gi)">10 paths</text>
  <text x="28" y="142" font-size="15" fill="#f1f5f9">5 C#/.NET services · ~8 weeks</text>
  <text x="28" y="176" font-size="15" fill="#94a3b8">MongoDB → PostgreSQL. 9 reached</text><text x="28" y="198" font-size="15" fill="#94a3b8">production with identical responses.</text>
</g></g>
</svg>
