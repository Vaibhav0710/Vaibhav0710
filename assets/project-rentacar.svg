<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-label="Rent-A-Car">
<title>Rent-A-Car</title>
<style>
text{font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{r:5;opacity:.9}100%{r:16;opacity:0}}
@keyframes drift1{50%{transform:translate(60px,30px)}}
@keyframes drift2{50%{transform:translate(-70px,-30px)}}
.f{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.ring{animation:pulse 2s ease-out infinite}
.o1{animation:drift1 14s ease-in-out infinite}
.o2{animation:drift2 18s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="grentacar" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
  <stop offset="0" stop-color="#22d3ee"/><stop offset=".33" stop-color="#a78bfa"/>
  <stop offset=".66" stop-color="#f472b6"/><stop offset="1" stop-color="#22d3ee"/>
  <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="bgrentacar" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#060912"/><stop offset="1" stop-color="#0d1328"/>
</linearGradient>
<radialGradient id="ocrentacar"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="ovrentacar"><stop offset="0" stop-color="#a78bfa" stop-opacity=".30"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<pattern id="dotsrentacar" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1e293b"/></pattern>
<clipPath id="crentacar"><rect width="600" height="240" rx="24"/></clipPath></defs>
<g clip-path="url(#crentacar)">
  <rect width="600" height="240" fill="url(#bgrentacar)"/>
  <rect width="600" height="240" fill="url(#dotsrentacar)" opacity=".6"/>
  <circle class="o1" cx="600" cy="0" r="192" fill="url(#ocrentacar)"/>
  <circle class="o2" cx="0" cy="288" r="216" fill="url(#ovrentacar)"/>

  <rect x="0" y="0" width="600" height="5" fill="#f472b6"/>
  <text x="36" y="66" font-size="28" font-weight="750" letter-spacing="-.5" fill="#f1f5f9">Rent-A-Car</text>
  <g transform="translate(536,38)"><circle cx="14" cy="14" r="18" fill="#0f172a" stroke="#1f2a44"/>
  <path d="M8 20 20 8M11 8h9v9" stroke="#f472b6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="36" y="104" font-size="17" fill="#94a3b8">Car-rental system with entity, DAO and service layers.</text><text x="36" y="130" font-size="17" fill="#94a3b8">Admins manage the fleet; customers register and book.</text>
  <rect x="36" y="180" width="80" height="29" rx="14.5" fill="#0f172a" stroke="#1e2a44"/><text class="mono" x="48" y="199.2" font-size="13" fill="#f472b6">Java 17</text><rect x="126.42" y="180" width="56" height="29" rx="14.5" fill="#0f172a" stroke="#1e2a44"/><text class="mono" x="138.42000000000002" y="199.2" font-size="13" fill="#f472b6">JDBC</text><rect x="192.66000000000003" y="180" width="64" height="29" rx="14.5" fill="#0f172a" stroke="#1e2a44"/><text class="mono" x="204.66000000000003" y="199.2" font-size="13" fill="#f472b6">MySQL</text>

</g>
<rect x=".5" y=".5" width="599" height="239" rx="24" fill="none" stroke="#1f2a44"/>
</svg>
