name: Update README

on:
  schedule: # daily at 03:17 UTC
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh recent commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_readme.py

      # Commits under my own name; does nothing when the list is unchanged
      - name: Commit and push
        run: |
          git config user.name "Vaibhav Jain"
          git config user.email "vaibhavjain7171@gmail.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update recent commits"
          git push
